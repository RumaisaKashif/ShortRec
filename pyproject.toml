[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortrec"
version = "0.1.0"
description = "Two-stage short-video recommender: two-tower retrieval + MLP engagement ranking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "faiss-cpu>=1.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
demo = ["gradio>=4.0"]

[tool.setuptools]
packages = ["shortrec"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E402"]  # deliberate late imports after sys.path tweak in demo/app.py

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
