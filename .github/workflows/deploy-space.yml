name: Deploy to Hugging Face Spaces

# Deploys the Gradio demo after CI passes on main, and on manual dispatch.
# Requires two repo settings (Settings -> Secrets and variables -> Actions):
#   - Secret   HF_TOKEN     : a Hugging Face *write* access token
#   - Variable HF_USERNAME  : your Hugging Face username
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if CI succeeded (or when triggered manually).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.24"

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ]; then
            echo "::error::Set the HF_TOKEN secret and HF_USERNAME variable in repo settings."
            exit 1
          fi
          python scripts/deploy_space.py --username "$HF_USERNAME"

      - name: Wait for the Space to come up
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
        run: python scripts/check_space.py
